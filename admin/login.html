<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin login | Prime Assets Nigeria</title><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"></head>
<body><main class="section"><div class="container" style="max-width:480px"><a class="brand" href="../index.html"><span class="brand-mark" aria-hidden="true">PA</span><span>Prime Assets Nigeria</span></a><form class="form-stack" data-login-form style="margin-top:2rem"><h1 style="font-size:2rem">Admin sign in</h1><p class="muted">Sign in with your administrator account.</p><div class="field"><label for="login-email">Email</label><input id="login-email" name="email" type="email" autocomplete="username" required></div><div class="field"><label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required></div><button class="button" type="submit">Sign in</button><p data-login-message aria-live="polite"></p></form><details style="margin-top:1.5rem"><summary>Create an admin account</summary><p class="muted">Anyone can register. Every account can manage all listings, agents, enquiries, and site settings across Prime Assets Nigeria.</p><form class="form-stack" data-signup-form style="margin-top:1rem"><div class="field"><label for="signup-email">Email</label><input id="signup-email" name="email" type="email" autocomplete="email" required></div><div class="field"><label for="signup-password">Password (at least 8 characters)</label><input id="signup-password" name="password" type="password" autocomplete="new-password" minlength="8" required></div><button class="button" type="submit">Create admin account</button><p data-signup-message aria-live="polite"></p></form></details></div></main><script type="module" src="../js/pages/admin-login.js"></script></body></html>
